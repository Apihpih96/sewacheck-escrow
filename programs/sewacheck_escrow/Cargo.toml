[package]
name = "sewacheck_escrow"
version = "0.1.0"
description = "SewaCheck rental deposit escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sewacheck_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# cfg names emitted by Anchor/Solana macros; declaring them silences the unexpected_cfgs warnings.
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"
